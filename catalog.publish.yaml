# What publishes, and where.
#
# Everything under publish_dir is synced 1:1 to write_prefix. Data files are
# never placed under publish_dir, so they cannot be published by accident.
# The GeoParquet partitions and the PMTiles archive are uploaded separately
# from staging/, which is why they do not appear here.

# The S3 URI uploads are written to.
write_prefix: s3://us-west-2.opendata.source.coop/nlebovits/microsoft-ml-road-detections

# The public base URL that serves write_prefix. Every href in the catalog is
# built from this, so it goes in the STAC JSON and write_prefix does not.
# Source Cooperative serves the same objects under two hostnames: source.coop
# renders pages for people, data.source.coop returns raw bytes for machines.
# STAC hrefs are resolved programmatically, so they use data.source.coop.
public_base: https://data.source.coop/nlebovits/microsoft-ml-road-detections

region: us-west-2

# The directory that IS the published catalog, synced 1:1 to write_prefix.
# Nothing outside it is ever uploaded.
publish_dir: catalog

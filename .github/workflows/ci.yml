name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned, as the template advises once a catalog is real. Conformance is
      # a claim about a specific validator, so an unpinned one means CI can go
      # from green to red without this repository changing. Bump deliberately.
      - name: Install the validators
        run: python -m pip install 'rashid==0.1.5' stac-check

      - name: Lint the tooling
        run: |
          python -m pip install pyflakes
          pyflakes tools/*.py tests/*.py

      - name: Catalog gates
        run: python3 tests/run_all.py
